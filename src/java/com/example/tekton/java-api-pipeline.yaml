apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: java-api-ci
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone-source
      taskRef:
        name: git-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-java
      runAfter:
        - clone-source
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: shared-workspace

